[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "takvim"
version = "0.1.0"
description = "Yerel-oncelikli takvim uygulamasi - saf mantik cekirdegi (Faz 0)"
requires-python = ">=3.12"
dependencies = [
    "python-dateutil>=2.9",
    # tzdata blueprint'teki listede yok, ama Windows'ta isletim sisteminin IANA
    # veritabani olmadigi icin stdlib zoneinfo tek basina calismaz
    # (ZoneInfoNotFoundError). Opsiyonel bir kolaylik degil, zorunluluk.
    "tzdata>=2024.1; sys_platform == 'win32'",
    # Faz 2 (.ics içe aktarma) için önceden onaylı bağımlılık.
    "icalendar>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Son kullanıcıya verilecek tek dosyalık .exe için; ÇALIŞMA ZAMANI
# bağımlılığı değil, yalnızca paketleme aşamasında gerekiyor.
build = ["pyinstaller>=6"]

[tool.setuptools]
package-data = { store = ["schema.sql", "migrations/*.sql"], ui = ["static/*"] }
packages = ["core", "store", "ics", "ui", "remind"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
