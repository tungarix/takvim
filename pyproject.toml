[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "takvim"
version = "1.4.0"
description = "Yerel-öncelikli, hesapsız, çevrimdışı masaüstü takvim uygulaması"
requires-python = ">=3.12"
dependencies = [
    "python-dateutil>=2.9",
    # tzdata blueprint'teki listede yok, ama Windows'ta işletim sisteminin IANA
    # veritabanı olmadığı için stdlib zoneinfo tek başına çalışmaz
    # (ZoneInfoNotFoundError). Opsiyonel bir kolaylık değil, zorunluluk.
    "tzdata>=2024.1; sys_platform == 'win32'",
    # Faz 2 (.ics içe aktarma) için önceden onaylı bağımlılık.
    "icalendar>=6",
    # Masaüstü penceresi. Uygulama tarayıcıda değil kendi penceresinde açılıyor
    # ve bunu Windows'un KENDİ WebView2 bileşeniyle yapıyor -- yani uygulamanın
    # içine bir tarayıcı motoru gömülmüyor, işletim sistemindeki kullanılıyor.
    # Yanında pythonnet geliyor (WebView2'nin .NET arayüzü için); ikisi de
    # yalnızca Windows'ta gerekli.
    "pywebview>=6.2; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8", "mypy>=1.13", "types-python-dateutil>=2.9"]
# Son kullanıcıya verilecek tek dosyalık .exe için; ÇALIŞMA ZAMANI
# bağımlılığı değil, yalnızca paketleme aşamasında gerekiyor.
build = ["pyinstaller>=6"]
# app.js duman testleri (tests/test_frontend_smoke.py) için ayrı bir grup:
# `pip install -e ".[dev]"` çalıştıran herkes ~115 MB'lık bir Chromium
# indirmeyi zorunlu tutmasın, yalnızca bu testleri koşan istesin.
test-ui = ["pytest-playwright>=0.5"]

[tool.setuptools]
package-data = { store = ["schema.sql", "migrations/*.sql"], ui = ["static/*"] }
packages = ["core", "store", "ics", "ui", "remind"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py312"
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
# Bilinçli olarak SEÇİLMEDİ (her biri gerçek bir tasarım kararına dokunuyor):
# - BLE (blind-except): hatırlatıcı döngüsü, yedek, pencere geri düşüşü bilerek
#   geniş yakalıyor; daraltmak uzun yaşayan süreçleri tek hatayla öldürür.
# - DTZ (naive datetime): duvar saati (`from_wall_clock`, gece yarısı) bilerek
#   naive kurulup tzid ile anlamlandırılıyor; UTC dayatmak DST'yi bozar.
# - S (try-except-pass/continue): yedek/log/import bilerek sessiz geçiyor.
# - TRY004: `ensure_aware` API'si ValueError sözü veriyor, testler ona kilitli.
# - RUF022 (`__all__` sırası): liste kamusal API sırası, alfabetik değil.
# - PYI034: `Repo.__enter__` zaten `-> "Repo"` döndürüyor; kural stub odaklı.
# - SIM115: günlük akışı sürecin ömrü boyunca AÇIK kalmalı (stdout yönlendirme).
# - PLW1510/S112: bildirim zinciri ve .ics satır toleransı bilerek böyle.
select = ["F", "I", "UP", "RUF100"]

[tool.mypy]
python_version = "3.12"
# `core/` + `store/` katı; `ui/` + `remind/` + `ics/` gevşek (ağ/arayüz kodu).
[[tool.mypy.overrides]]
module = ["ui.*", "remind.*", "ics.*", "takvim_app"]
ignore_errors = true
