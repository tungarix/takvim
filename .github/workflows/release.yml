name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# En az yetki: release oluşturmak (contents), attestation üretmek
# (id-token + attestations) için gerekenin ötesine çıkma.
permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    # ci.yml ile aynı sebep: pywebview/pythonnet gibi platforma özgü kod
    # yolları gerçekten Windows'ta derlenip test edilsin.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Güvenlik kapısı önceki etiketi ve incelenen commit'i görmeli.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Etiketli sürümde, o sürümün güvenlik incelemesi kayıtlı ve güncel değilse
      # derleme başlamaz. Biçim: guvenlik/incelemeler/README.md
      # Etiket adı `${{ }}` ile komutun İÇİNE gömülmüyor, ortam değişkeninden
      # okunuyor: git etiket adında `"`, `$`, `(`, `;` olabilir ve gömülen metin
      # kabuk komutu olarak çalışırdı (GitHub'ın "script injection" uyarısı).
      - name: Güvenlik kapısı
        if: startsWith(github.ref, 'refs/tags/')
        env:
          ETIKET: ${{ github.ref_name }}
        run: python scripts/guvenlik_kapisi.py "$env:ETIKET"

      - name: Bağımlılıkları kur
        run: python -m pip install -e ".[dev,build]"

      - name: Testler (paketlemeden önce)
        run: python -m pytest -q

      - name: .exe derle
        run: python -m PyInstaller takvim.spec --noconfirm --clean

      # Testler kaynağı sınıyor, kullanıcıya giden ise exe. Paketlemede unutulan
      # bir veri dosyası (AGENTS 27) ya da yükseltilmeyen sürüm numarası ancak
      # exe çalışınca görünür. Bozuk exe'ye özet/attestation üretilmesin diye
      # bu adım onlardan ÖNCE. Etiket yalnızca etiketli çalıştırmada verilir.
      - name: .exe duman testi
        env:
          ETIKET: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: python scripts/exe_duman.py --exe dist/Takvim.exe

      - name: SHA256 hesapla
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/Takvim.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  Takvim.exe" | Set-Content -Path SHA256SUMS.txt -Encoding ascii

      - name: Build provenance attestation üret
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/Takvim.exe

      - name: Taslak (draft) release oluştur
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          ETIKET: ${{ github.ref_name }}
        run: >
          gh release create "$env:ETIKET"
          dist/Takvim.exe SHA256SUMS.txt
          --draft
          --title "Takvim $env:ETIKET"
          --notes ""

      - name: Artifact olarak yükle (yalnızca manuel çalıştırma)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: Takvim-exe
          path: |
            dist/Takvim.exe
            SHA256SUMS.txt
