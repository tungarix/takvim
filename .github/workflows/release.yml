name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# En az yetki: release oluşturmak (contents), attestation üretmek
# (id-token + attestations) için gerekenin ötesine çıkma.
permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    # ci.yml ile aynı sebep: pywebview/pythonnet gibi platforma özgü kod
    # yolları gerçekten Windows'ta derlenip test edilsin.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Bağımlılıkları kur
        run: python -m pip install -e ".[dev,build]"

      - name: Testler (paketlemeden önce)
        run: python -m pytest -q

      - name: .exe derle
        run: python -m PyInstaller takvim.spec --noconfirm --clean

      - name: SHA256 hesapla
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/Takvim.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  Takvim.exe" | Set-Content -Path SHA256SUMS.txt -Encoding ascii

      - name: Build provenance attestation üret
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/Takvim.exe

      - name: Taslak (draft) release oluştur
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          dist/Takvim.exe SHA256SUMS.txt
          --draft
          --title "Takvim ${{ github.ref_name }}"
          --notes ""

      - name: Artifact olarak yükle (yalnızca manuel çalıştırma)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Takvim-exe
          path: |
            dist/Takvim.exe
            SHA256SUMS.txt
