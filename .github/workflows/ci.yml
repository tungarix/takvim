name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    # Windows: pywebview/pythonnet ve os.startfile gibi platforma özgü kod
    # yollarını da gerçekten çalıştırır -- ubuntu-latest'te bunlar hiç
    # denenmeden "geçerdi".
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bağımlılıkları kur
        run: python -m pip install -e ".[dev]"

      - name: ruff
        run: python -m ruff check .

      - name: mypy (core + store)
        run: python -m mypy core store

      - name: pytest
        run: python -m pytest -q

      - name: app.js sözdizimi
        run: node --check ui/static/app.js
