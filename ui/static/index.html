<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Takvim</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="ust-cubuk">
  <div class="marka">Takvim</div>

  <nav class="gezinme">
    <button id="onceki" class="ikon-dugme" title="Önceki (←)" aria-label="Önceki">‹</button>
    <button id="bugun" class="dugme">Bugün</button>
    <button id="sonraki" class="ikon-dugme" title="Sonraki (→)" aria-label="Sonraki">›</button>
  </nav>

  <h1 id="baslik" class="hafta-etiketi">—</h1>

  <div class="gorunum-anahtari" role="group" aria-label="Görünüm">
    <button class="gorunum-dugme" data-gorunum="day">Gün</button>
    <button class="gorunum-dugme secili" data-gorunum="week">Hafta</button>
    <button class="gorunum-dugme" data-gorunum="month">Ay</button>
  </div>

  <div class="bosluk"></div>

  <!-- Submit düğmesi ŞART: düğmesiz tek girdili formda Enter'ın örtük submit
       tetiklemesi garanti değil. Ayrıca fare kullanıcısına karşılık veriyor. -->
  <form id="hizli-form" class="hizli-form" autocomplete="off">
    <input id="hizli-girdi" class="hizli-girdi" type="text"
           placeholder="Hızlı ekle: yarın 14:00 diş hekimi" aria-label="Hızlı ekleme">
    <button type="submit" class="hizli-dugme" title="Ekle" aria-label="Ekle">+</button>
  </form>

  <input id="arama" class="arama" type="search" placeholder="Ara…" aria-label="Ara">

  <button id="disa-aktar" class="dugme" title="Tüm takvimi .ics olarak indir">Dışa aktar</button>
  <button id="ice-aktar" class="dugme" title=".ics dosyasından içe aktar (önizlemeli)">İçe aktar</button>
  <input type="file" id="ice-aktar-dosya" accept=".ics,text/calendar" hidden>
  <button id="yedekler" class="dugme" title="Otomatik yedekleri listele ve geri yükle">Yedekler</button>
  <div id="tz-etiketi" class="tz-etiketi"></div>
</header>

<div class="govde">

  <aside class="kenar">
    <h2 class="kenar-baslik">
      Takvimler
      <button type="button" id="takvim-ekle" class="kenar-ekle" title="Yeni takvim">+</button>
    </h2>
    <ul id="takvim-listesi" class="takvim-listesi"></ul>

    <div id="arama-bolum" class="arama-bolum" hidden>
      <h2 class="kenar-baslik">Arama sonuçları</h2>
      <ul id="arama-listesi" class="arama-listesi"></ul>
    </div>

    <p class="ipucu">
      Boş bir saate tıkla, yeni etkinlik oluştur.<br>
      Etkinliğe tıkla, ayrıntısı sağda açılır.<br>
      <kbd>←</kbd> <kbd>→</kbd> gezin · <kbd>T</kbd> bugün ·
      <kbd>G</kbd>/<kbd>H</kbd>/<kbd>A</kbd> görünüm · <kbd>Esc</kbd> kapat<br>
      Seçiliyken: <kbd>Del</kbd> sil · <kbd>Shift</kbd>+<kbd>Del</kbd> seriyi sil ·
      <kbd>F2</kbd> / <kbd>Enter</kbd> düzenle
    </p>
  </aside>

  <main class="izgara-sarmal">
    <!-- Zaman ızgarası: gün ve hafta görünümleri -->
    <div id="zaman-gorunum">
      <div class="izgara-baslik" id="izgara-baslik"></div>
      <div class="tumgun-serit" id="tumgun-serit"></div>
      <div class="izgara-kaydirma" id="izgara-kaydirma">
        <div class="izgara" id="izgara">
          <div class="saat-sutunu" id="saat-sutunu"></div>
          <div class="gunler" id="gunler"></div>
        </div>
      </div>
    </div>

    <!-- Ay görünümü: saat ızgarası yok -->
    <div id="ay-gorunum" class="ay-gorunum" hidden>
      <div class="ay-basliklar" id="ay-basliklar"></div>
      <div class="ay-izgara" id="ay-izgara"></div>
    </div>
  </main>

  <aside class="panel" id="panel" hidden>
    <button class="panel-kapat" id="panel-kapat" aria-label="Kapat">×</button>
    <div class="panel-icerik" id="panel-icerik"></div>
    <div class="panel-islemler" id="panel-islemler"></div>
  </aside>

</div>

<div class="bildirim" id="bildirim" hidden></div>

<!-- Uygulama içi soru/onay penceresi. Tarayıcının prompt()/confirm()'ü yerine
     bunu kullanıyoruz: onlar masaüstü penceresinde "Bu sayfayı şunu diyor:"
     başlığıyla çıkıyor ve uygulamayı web sayfası gibi gösteriyor. -->
<div class="perde" id="perde" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-baslik">
    <h2 class="modal-baslik" id="modal-baslik"></h2>
    <p class="modal-metin" id="modal-metin"></p>
    <!-- Alanlar JS tarafından kuruluyor: tek satırlık soru da, çok alanlı
         düzenleme formu da aynı kutuyu kullanıyor. -->
    <div class="modal-alanlar" id="modal-alanlar" hidden></div>
    <div class="modal-islemler">
      <button type="button" class="dugme" id="modal-iptal">İptal</button>
      <button type="button" class="dugme birincil" id="modal-tamam">Tamam</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
